name: ci-pipeline

on:
  push:
    branches: 
      - dev
  pull_request:
    branches: 
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with maven
      run: |
        cd spring-boot-student-app-api
        mvn clean install
        
    - name: Run unit test
      run: mvn test
    
    - name: Login docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build & push backend image
      run: |
        cd spring-boot-student-app-api
        docker build -t longppham5/springboot-app:${{ github.sha }} .
        docker push longppham5/springboot-app:${{ github.sha }}
    
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build & push frontend image
      run: |
        cd react-student-management
        docker build -t longppham5/nodejs-app:${{ github.sha }} .
        docker push longppham5/nodejs-app:${{ github.sha }}
    
  update-manifest:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
    - name: Checkout manifest repo
      uses: actions/checkout@v4
      with: 
        repository: longppham5/k8s
        token: ${{ secrets.PAT_SECRET }}
        path: manifests
        fetch-depth: 0
    - run: |
        sed -i "s#longppham5/springboot-app:.*#longppham5/springboot-app:${{ github.sha }}#g" manifests/k8s/backend/deployment-backend.yaml
        sed -i "s#longppham5/nodejs-app:.*#longppham5/nodejs-app:${{ github.sha }}#g" manifests/k8s/frontend/frontend-deployment.yaml
        cd manifests
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git commit -am "Update images to ${{ github.sha }}"
        git push origin main