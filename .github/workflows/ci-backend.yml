name: ci-frontend-pipeline
concurrency:
  group: ci-manifests
  cancel-in-progress: false
on:
  push:
    branches: 
      - dev
    paths:
      - 'spring-boot-student-app-api/*'
  pull_request:
    branches: 
      - dev
    paths:
      - 'spring-boot-student-app-api/*'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with maven
      run: |
        cd spring-boot-student-app-api
        mvn clean install
        
    - name: Run unit test
      run: |
        cd spring-boot-student-app-api
        mvn test
    
    - name: Login docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build & push backend image
      run: |
        cd spring-boot-student-app-api
        docker build -t longppham5/springboot-app:${{ github.sha }} .
        docker push longppham5/springboot-app:${{ github.sha }}
  
  update-manifest:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
    - name: Checkout manifest repo
      uses: actions/checkout@v4
      with: 
        repository: longpham5/k8s
        token: ${{ secrets.PAT_SECRET }}
        path: manifests
        fetch-depth: 0
    - run: |
        sed -i "s#tag: .*#tag: ${{ github.sha }}#g" manifests/charts/backend/values.yaml
        cd manifests
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git commit -am "Update images backend to ${{ github.sha }}"
        git push origin main