name: ci-frontend-pipeline
concurrency:
  group: ci-manifests
  cancel-in-progress: false
on:
  push:
    branches: 
      - dev
    paths:
      - 'react-student-management/**'
  pull_request:
    branches: 
      - dev
    paths:
      - 'react-student-management/**'


jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login docker
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

    - name: Build & push frontend image
      run: |
        cd react-student-management
        docker build -t longppham5/nodejs-app:${{ github.sha }} .
        docker push longppham5/nodejs-app:${{ github.sha }}
  
  update-manifest:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
    - name: Checkout manifest repo
      uses: actions/checkout@v4
      with: 
        repository: longpham5/k8s
        token: ${{ secrets.PAT_SECRET }}
        path: manifests
        fetch-depth: 0
    - run: |
        sed -i "s#tag: .*#tag: ${{ github.sha }}#g" manifests/values.yaml
        cd manifests
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git commit -am "Update images frontend to ${{ github.sha }}"
        git push origin main